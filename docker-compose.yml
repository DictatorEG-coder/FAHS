services:
  fahs:
    build: .
    container_name: fahs-security
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    env_file:
      - .env
    volumes:
      - fahs-data:/app/data
volumes:
  fahs-data:
